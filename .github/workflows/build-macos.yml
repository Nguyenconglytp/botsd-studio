# Build BOTSD Studio cho macOS Apple Silicon trên máy Mac M của GitHub (không cần có Mac).
# - Bấm "Run workflow" trong tab Actions  -> tải file .dmg ở mục Artifacts.
# - Đẩy tag dạng v1.2.0                     -> tự tạo Release kèm file .dmg để gửi người dùng.
name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64)
    env:
      BOTSD_CONFIG_JSON: ${{ secrets.BOTSD_CONFIG_JSON }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Kiểm tra Tkinter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Ghi config.json đóng gói kèm app (từ secret BOTSD_CONFIG_JSON)
        if: env.BOTSD_CONFIG_JSON != ''
        run: printf '%s' "$BOTSD_CONFIG_JSON" > config.json

      - name: Nạp chứng chỉ Developer ID vào keychain
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build .app + .dmg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; fi
          PYTHON="$(which python)" bash build_macos.sh

      - uses: actions/upload-artifact@v5
        with:
          name: BOTSD_Studio_macOS
          path: dist/macos/*.dmg

      - name: Tạo Release (khi đẩy tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/macos/*.dmg
